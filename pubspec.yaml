name: givenget
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  smooth_page_indicator: ^1.2.1
  multi_select_flutter: ^4.1.3
  image_picker: ^1.1.2
  flutter_appauth: ^9.0.0
  http: ^0.13.5
  path: ^1.8.3
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/GiveNGet.png"
  adaptive_icon_foreground: "assets/images/GiveNGet.png"
  adaptive_icon_background: "#FFFFFF"
  remove_alpha_ios: true
